<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>맞춤법 교정실</title>
<meta name="description" content="고1 한글 맞춤법 반복 연습 — 조항 카드, 바른 표기, 근거 조항, 조항 빈칸">
<meta name="theme-color" content="#bf1f1a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="맞춤법">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
<link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css" rel="stylesheet" media="print" onload="this.media='all'">
<style>
/* 한 줄 폭(최대 560px). 본문 Pretendard 자간 -3%, 글자 크기 짝수(최소 12), 한 줄은 행간 auto·여러 줄은 150%.
   제목은 주아체. 색은 로고 크레파스 빨강 하나: 주요 버튼·선택·교정 표시. 틀린 답은 회색 줄긋기. */
:root{
  --bg:#fbf8f1; --paper:#ffffff; --ink:#1c1b1a; --muted:#75716b; --rule:#e6e2da; --plate:#efebe3;
  --accent:#bf1f1a; --soft:#f9e8e5;
  --jua:"Jua","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --sans:"Pretendard Variable",Pretendard,-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
}
@media (min-width:700px){.wrap{max-width:640px}.hero img{width:96px}}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#151514; --paper:#1f1e1c; --ink:#ecebe7; --muted:#a19d97; --rule:#36332f; --plate:#2a2826;
  --accent:#e2574f; --soft:#3b2220; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#151514; --paper:#1f1e1c; --ink:#ecebe7; --muted:#a19d97; --rule:#36332f; --plate:#2a2826;
  --accent:#e2574f; --soft:#3b2220; color-scheme:dark}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{font-synthesis:none;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:16px;letter-spacing:-.03em;line-height:1.5;margin:0;word-break:keep-all}
.wrap{max-width:560px;margin:0 auto;padding:16px 20px 48px}
button{font:inherit;letter-spacing:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,summary:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
p{margin:0}

.eyebrow{font-size:12px;line-height:normal;color:var(--muted);margin-bottom:2px}
header.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:8px 0 20px}
.brand{font-family:var(--jua);font-size:20px;letter-spacing:0;line-height:normal;margin:0;cursor:pointer;white-space:nowrap;font-weight:400}
.brand .heart{color:var(--accent);margin-right:6px;font-family:var(--sans)}
.tabs{display:flex;gap:16px}
.tabs[hidden]{display:none}
.tabs button{position:relative;background:none;border:0;padding:4px 0;font-size:14px;font-weight:500;line-height:normal;color:var(--muted);border-bottom:2px solid transparent}
.tabs button[aria-current="page"]{color:var(--ink);border-bottom-color:var(--accent);font-weight:600}

/* 작은 글자 버튼의 손가락 영역 넓히기(보이는 크기는 그대로) */
.linkbtn::before,.tabs button::before,.tk::before{content:"";position:absolute;inset:-10px -6px}
h2.sec{font-size:14px;font-weight:600;line-height:normal;color:var(--muted);margin:28px 0 10px}
.hero{display:flex;gap:12px;align-items:center;margin-bottom:20px}
.hero img{width:80px;height:auto;display:block;flex:none}
.bubble{position:relative;background:var(--paper);border:1px solid var(--rule);border-radius:12px;padding:10px 12px;font-size:14px;line-height:1.5}
.bubble::before{content:"";position:absolute;left:-7px;top:50%;width:12px;height:12px;background:var(--paper);border-left:1px solid var(--rule);border-bottom:1px solid var(--rule);transform:translateY(-50%) rotate(45deg)}
.who{font-size:14px;line-height:normal;color:var(--muted);margin:0 0 20px}
.who b{color:var(--ink);font-weight:600}
.who .streak{color:var(--accent);font-weight:600}

.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:inline-flex;align-items:center;height:32px;padding:0 12px;border:1px solid var(--rule);background:var(--paper);border-radius:999px;font-size:14px;font-weight:500;line-height:normal;white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.chip:disabled{cursor:default;border-style:dashed;color:var(--muted);background:transparent;opacity:.8}
.note{font-size:14px;line-height:1.5;color:var(--muted);margin:8px 0 0}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:48px;padding:0 20px;border-radius:12px;border:1px solid var(--rule);background:var(--paper);font-size:16px;font-weight:600;line-height:normal}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff;height:56px;font-size:18px;font-weight:700;border-radius:14px}
.btn.wide{width:100%}
.btn:disabled{opacity:.45;cursor:default}
.linkbtn{position:relative;background:none;border:0;padding:0;font-size:14px;line-height:normal;color:var(--muted);text-decoration:underline;text-underline-offset:3px}
.setline{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:12px 4px 0;font-size:14px;line-height:normal;color:var(--muted)}
.settings{margin-top:16px;background:var(--paper);border:1px solid var(--rule);border-radius:16px;padding:4px 16px 16px}
.subscope{margin-top:10px;padding-left:12px;border-left:2px solid var(--rule)}
.subscope .lab{font-size:12px;line-height:normal;color:var(--muted);margin-bottom:6px}
.subscope .chip{height:32px;padding:0 11px;font-size:12px}
.srcs{list-style:none;padding:0;margin:10px 0 0;font-size:12px;color:var(--muted);line-height:1.5}
.srcs li{margin-top:2px}
.srcs b{color:var(--ink);font-weight:600;margin-right:6px}

.card{background:var(--paper);border:1px solid var(--rule);border-radius:16px;padding:16px}
.card+.card{margin-top:12px}
.stats{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;text-align:center}
.stat b{display:block;font-size:24px;font-weight:700;line-height:normal}
.stat span{font-size:12px;line-height:normal;color:var(--muted)}

/* 문제 */
.qtop{display:flex;align-items:center;justify-content:space-between;font-size:14px;line-height:normal;color:var(--muted)}
.bar{height:2px;background:var(--rule);margin:10px 0 24px}
.bar i{display:block;height:100%;background:var(--accent);transition:width .25s}
.qkind{font-size:12px;line-height:normal;color:var(--muted);font-weight:600;margin-bottom:12px}
.qsent{font-size:20px;font-weight:500;line-height:2;margin:0 0 20px;padding-top:.4em;overflow-wrap:anywhere}
.slot{display:inline-block;min-width:3.4em;border-bottom:2px solid var(--accent);text-align:center;line-height:1.4;padding:0 2px}
.slot.on{border-bottom-color:var(--accent);color:var(--accent);font-weight:700}
.slot.on::before{content:"✓ ";font-weight:700}
.fix{position:relative;display:inline-block;line-height:1.4}
.fix s{text-decoration-color:var(--muted);text-decoration-thickness:2px;color:var(--muted)}
.fix b{position:absolute;left:50%;top:-1.15em;transform:translateX(-50%);color:var(--accent);font-size:.9em;white-space:nowrap;font-weight:700}
.swc .fix b{font-size:1em;top:-1.2em}
.mark{text-decoration:underline;text-decoration-color:var(--accent);text-decoration-thickness:2px;text-underline-offset:6px;font-weight:700}
.opts{display:grid;gap:10px}
.opts.two{grid-template-columns:1fr 1fr}
.opt{background:var(--paper);border:1px solid var(--rule);border-radius:12px;padding:14px;text-align:left;font-size:16px;line-height:1.5}
.opts.two .opt{text-align:center;font-size:18px;font-weight:500;line-height:normal;padding:16px 10px}
.opt small{display:block;color:var(--muted);font-size:12px;line-height:normal;margin-top:4px;font-weight:400}
.opt.ok{border-color:var(--accent);background:var(--soft);color:var(--accent);font-weight:700}
.opt.ok::before{content:"✓ "}
.opt.ng{color:var(--muted);text-decoration:line-through;text-decoration-color:var(--muted)}
.opt:disabled{cursor:default}
.blankrow{font-size:18px;line-height:2;overflow-wrap:anywhere}
.blankrow input{font:inherit;letter-spacing:inherit;max-width:100%;border:1.5px solid var(--accent);background:var(--paper);color:var(--ink);text-align:center;padding:2px 6px;border-radius:8px;margin:0 2px;line-height:1.5}
.fb{margin-top:20px;min-height:1.6em}
.fb .okword{color:var(--accent);font-weight:700;font-size:16px;line-height:normal;margin-bottom:12px}
.why{border-left:2px solid var(--accent);padding:2px 0 2px 12px;font-size:14px;line-height:1.5}
.why b{font-weight:600}
.next{margin-top:20px}

/* 틀린 곳 찾기(대화) */
.chat{display:grid;gap:10px;margin-bottom:20px}
.msg{display:flex}.msg.b{justify-content:flex-end}
.bb{max-width:88%;background:var(--paper);border:1px solid var(--rule);border-radius:16px;padding:10px 12px;font-size:16px;line-height:1.9}
.msg.a .bb{border-bottom-left-radius:4px}.msg.b .bb{background:var(--plate);border-color:var(--plate);border-bottom-right-radius:4px}
.tk{position:relative;background:none;border:0;padding:0;margin:0;border-radius:2px;font:inherit;letter-spacing:inherit;line-height:1.4;box-shadow:0 2px 0 transparent}
.tk.sel{box-shadow:0 2px 0 var(--accent);background:var(--soft)}
.tk.hit{color:var(--accent);font-weight:700;background:none}
.tk.missed{color:var(--accent);background:var(--soft);box-shadow:0 2px 0 var(--accent)}
.tk.oops{text-decoration:line-through;color:var(--muted);background:none;box-shadow:0 2px 0 var(--muted)}
.tk s{color:var(--muted);font-weight:400;margin-right:4px}.tk b{font-weight:700}
.tk:disabled{cursor:default}
/* 쓱쓱 */
.swipe{position:relative;height:150px;margin:4px 0 12px;touch-action:none;overscroll-behavior:contain}
.swhint{display:flex;justify-content:space-between;font-size:14px;line-height:normal;color:var(--muted);padding:0 6px}
.swhint b{font-weight:600}
.swc.nudge{animation:nudge 1.1s ease-in-out .3s 1}
@keyframes nudge{0%,100%{transform:none}25%{transform:translateX(26px) rotate(1.5deg)}75%{transform:translateX(-26px) rotate(-1.5deg)}}
.swc{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:20px 24px;background:var(--paper);border:1px solid var(--rule);border-radius:20px;box-shadow:0 6px 24px rgba(0,0,0,.06);user-select:none;cursor:grab;overflow:hidden}
.swc.still{cursor:default}
.swc .qsent{text-align:center}
.stamp{position:absolute;top:14px;padding:4px 10px;border:2px solid;border-radius:8px;font-size:14px;font-weight:700;line-height:normal;opacity:0;pointer-events:none}
.stamp.ok{right:14px;color:var(--accent);border-color:var(--accent);transform:rotate(12deg)}
.stamp.no{left:14px;color:var(--muted);border-color:var(--muted);transform:rotate(-12deg)}
.stampbig{position:absolute;bottom:8px;right:10px;width:96px;height:auto;opacity:0;transform:rotate(10deg) scale(2);animation:stampin .3s cubic-bezier(.2,1.4,.4,1) forwards;pointer-events:none}
@keyframes stampin{to{opacity:.95;transform:rotate(10deg) scale(1)}}
.okmark{display:flex;align-items:center;gap:8px;margin-bottom:12px;color:var(--accent);font-weight:700;font-size:16px;line-height:normal}
.okmark img{width:34px;height:auto;animation:stampin .3s cubic-bezier(.2,1.4,.4,1) forwards;opacity:0;transform:scale(2)}
/* 결과 */
.scorebox{position:relative}
.stampimg{position:absolute;right:0;top:-24px;width:150px;height:150px;transform:rotate(-12deg) scale(2.2);opacity:0;animation:stamp .45s cubic-bezier(.2,1.4,.4,1) .25s forwards;pointer-events:none}
@keyframes stamp{to{transform:rotate(-12deg) scale(1);opacity:.95}}
.score{font-size:32px;font-weight:700;line-height:normal;margin:4px 0 0}
.score span{font-size:16px;color:var(--muted);font-weight:500}
.wlist{list-style:none;padding:0;margin:0}
.wlist li{border-top:1px solid var(--rule);padding:18px 0 12px}
.wlist .w1{font-size:16px;line-height:2}
.wlist .w2{font-size:12px;line-height:1.5;color:var(--muted)}
.row{display:flex;flex-wrap:wrap;gap:10px;margin-top:24px}
.row .btn{flex:1 1 auto}

/* 조항 카드 */
.chap{font-family:var(--jua);font-size:18px;letter-spacing:0;line-height:normal;margin:32px 0 8px;padding-bottom:8px;border-bottom:1px solid var(--rule)}
.chap span{font-family:var(--sans);letter-spacing:-.03em;font-size:12px;color:var(--muted);font-weight:500;margin-right:6px}
details.art{border-bottom:1px solid var(--rule)}
details.art summary{list-style:none;display:grid;grid-template-columns:3.4em 1fr auto;column-gap:10px;align-items:baseline;padding:14px 2px;cursor:pointer}
details.art summary::-webkit-details-marker{display:none}
details.art summary .no{font-weight:700;font-size:16px;line-height:normal}
details.art summary .k{font-size:16px;line-height:normal}
details.art summary .cnt{font-size:12px;line-height:normal;color:var(--muted)}
details.art summary .tag{grid-column:2/4;margin-top:6px;font-size:12px;line-height:normal;font-weight:600;color:var(--accent)}
details.art[open] summary .no{color:var(--accent)}
.artbody{padding:2px 2px 20px}
.law{background:var(--paper);border:1px solid var(--rule);border-radius:12px;padding:14px;margin:0 0 12px;font-size:16px;line-height:1.5}
.law .sub{display:block;margin-top:6px;font-size:14px}
.law .sub b{color:var(--accent);font-weight:700;margin-right:4px}
.core{font-size:14px;line-height:1.5;margin:12px 0}
.core::before{content:"\2665\FE0E";font-family:var(--sans);color:var(--accent);margin-right:6px}
.exg{margin:10px 0}
.exg .lab{font-size:12px;line-height:normal;color:var(--muted);margin-bottom:4px}
.ex{display:flex;flex-wrap:wrap;gap:6px}
.ex span{background:var(--paper);border:1px solid var(--rule);border-radius:6px;padding:2px 8px;font-size:14px;line-height:1.5}
.pre{font-size:12px;line-height:1.5;color:var(--muted);margin-top:12px}
.pre b{color:var(--ink);font-weight:600}

/* 오답 */
.nrow{display:grid;grid-template-columns:3.6em 1fr auto;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--rule);font-size:14px;line-height:normal}
.nrow .no{font-weight:700}
.nrow .meter{display:block;height:6px;background:var(--plate);border-radius:3px;overflow:hidden}
.nrow .meter i{display:block;height:100%;background:var(--accent)}
.empty{color:var(--muted);font-size:14px;line-height:1.5;padding:18px 0}
/* 학교 고르기 */
.spick{display:grid;gap:10px;margin-top:18px}
.scard{display:block;width:100%;text-align:left;background:var(--paper);border:1px solid var(--rule);border-radius:16px;padding:14px 16px}
.scard .nm{display:flex;align-items:center;gap:8px;font-family:var(--jua);letter-spacing:0;font-size:18px;line-height:normal}
.scard .ds{display:block;font-size:12px;line-height:normal;color:var(--muted);margin-top:4px}
.scard.cur{border-color:var(--accent)}
.badge{font-family:var(--sans);letter-spacing:-.03em;font-size:12px;line-height:normal;font-weight:600;color:var(--accent);background:var(--soft);border-radius:999px;padding:2px 8px}
/* 로그인 */
.form{display:grid;gap:6px;margin-top:20px}
.form label{font-size:12px;line-height:normal;color:var(--muted);font-weight:600;margin-top:8px}
.form input{font:inherit;letter-spacing:inherit;font-size:18px;padding:12px;border:1px solid var(--rule);border-radius:12px;background:var(--paper);color:var(--ink);width:100%}
.form .btn.wide{margin-top:16px}
.err{color:var(--accent);font-size:14px;line-height:1.5;margin:6px 0 0}
.a2hs{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;background:var(--soft);border-radius:12px;padding:10px 12px;margin:0 0 16px;font-size:14px;line-height:1.5}
.a2hs b{font-weight:600}
/* 유형 고르기 카드 */
.types{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:16px}
.tcard{position:relative;display:flex;flex-direction:column;align-items:flex-start;gap:4px;padding:14px 14px 12px;background:var(--paper);border:1.5px solid var(--rule);border-radius:14px;text-align:left;min-height:96px}
.tcard b{font-size:16px;font-weight:700;line-height:normal}
.tcard span{font-size:12px;line-height:1.5;color:var(--muted);flex:1}
.tcard i{font-style:normal;font-size:12px;line-height:normal;color:var(--muted);margin-top:4px}
.tcard.on{border-color:var(--accent);background:var(--soft)}
.tcard.on b{color:var(--accent)}
.tcard.on::after{content:"✓";position:absolute;top:10px;right:12px;color:var(--accent);font-weight:700}
.tcard:disabled{opacity:.45;cursor:default}
/* 학교 대항 */
.vs{display:grid;gap:8px;margin-top:12px}
.vs .v{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;font-size:14px;line-height:normal}
.vs .v .s{font-weight:600;white-space:nowrap}
.vs .v .m{display:block;height:8px;background:var(--plate);border-radius:4px;overflow:hidden}
.vs .v .m i{display:block;height:100%;background:#d8cfc4;border-radius:4px}
.vs .v.me .m i{background:var(--accent)}
.vs .v.me .s{color:var(--accent)}
.vs .v .d{color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.vs .v .d b{color:var(--ink);font-weight:600}
.vs .v.me .d b{color:var(--accent)}
/* 순위표 */
.seg{display:flex;flex-wrap:wrap;justify-content:space-between;gap:8px;margin-bottom:8px}
.seg .chips{gap:6px}
.seg .chip{height:32px;padding:0 11px;font-size:12px}
.rank .r{display:grid;grid-template-columns:28px 1fr auto;gap:8px;align-items:baseline;padding:10px 0;border-top:1px solid var(--rule);font-size:14px;line-height:normal;font-variant-numeric:tabular-nums}
.rank .r:first-child{border-top:0}
.rank .r .no{color:var(--muted);font-weight:600}
.rank .r .nm{font-weight:600;min-width:0;line-height:1.5}
.rank .r .nm>span{white-space:nowrap}
.rank .r .nm small{font-weight:400;color:var(--muted);font-size:12px;margin-left:4px}
.rank .r .nm .sep{font-style:normal;font-weight:400;color:var(--muted)}
.rank .r .d{color:var(--muted)}
.rank .r.me{background:var(--soft);margin:0 -16px;padding:10px 16px;border-radius:10px;border-top:0}
.rank .r.me .no,.rank .r.me .nm,.rank .r.me .d{color:var(--accent)}
.rank .gap{text-align:center;color:var(--muted);font-size:12px;line-height:normal;padding:4px 0}
.rank-msg{font-size:14px;line-height:1.5;color:var(--muted);padding:8px 0 2px}
.rank-msg.go{color:var(--accent);font-weight:600}
footer{margin-top:48px;padding-top:12px;border-top:1px solid var(--rule);font-size:12px;line-height:1.5;color:var(--muted)}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div>
      <div class="eyebrow">고1 · 한글 맞춤법</div>
      <h1 class="brand" id="brand"><span class="heart">♥︎</span>맞춤법 교정실</h1>
    </div>
    <nav class="tabs" aria-label="메뉴">
      <button type="button" data-tab="practice">연습</button>
      <button type="button" data-tab="rules">조항</button>
      <button type="button" data-tab="notes">오답</button>
    </nav>
  </header>
  <main id="app"></main>
  <footer>조항 원문과 예시는 국립국어원 ‘한글 맞춤법’ 기준입니다.</footer>
</div>
<script src="data.js"></script>
<script src="school.js"></script>
<script src="spot.js"></script>
<script>
(function(){
'use strict';
const D = window.ORTH_COMMON;
const app = document.getElementById('app');

/* ---------- 서버: 내신 클리닉 트래커 웹 앱(계정·비밀번호 같이 씀). 비우면 로그인 없이 이 폰에만 저장 */
const API = 'https://script.google.com/macros/s/AKfycbxN_zUg62UVzI-xkiB_-CxSnZND29jsOmX6yDW-QLcFYvlQlh3QnpAGBCkDG11Zqik-_A/exec';

/* ---------- 기본 데이터 */
const SCHOOLS = ['공항고','동양고','명덕고','한서고','경복여고'];
const SS = window.ORTH_SCHOOL || {src:{}, map:{}};  // 학교별 교과서·프린트·올림포스 범위(school.js)
const PARTS = sc => ['기본 개념','교과서','프린트'].concat(sc==='경복여고'||sc==='명덕고' ? ['올림포스'] : []);
const SLOTS = [{id:'base', label:'기본 개념'}, {id:'tb', label:'교과서'}, {id:'pr', label:'프린트'}, {id:'ol', label:'올림포스'}];
const SLOT_LABEL = {}; SLOTS.forEach(x=>SLOT_LABEL[x.id]=x.label);
const ART = {}; D.arts.forEach(a=>ART[a.n]=a);
const RANGES = [
  {id:'s', label:'총칙·소리', ch:['c1','c3']},
  {id:'f', label:'형태', ch:['c4']},
  {id:'w', label:'띄어쓰기', ch:['c5']},
  {id:'e', label:'그 밖의 것', ch:['c6']},
];
// 홈에서 고르는 유형. 설명은 학생이 처음 봐도 뭘 하는지 알게 한 줄로
const TYPES = [
  {id:'pick', label:'바른 표기 고르기', desc:'문장을 보고 둘 중 맞는 표기를 고릅니다.'},
  {id:'swipe', label:'쓱쓱 넘기기', desc:'문장 하나씩, 맞으면 오른쪽 · 틀리면 왼쪽으로 밀어요.'},
  {id:'spot', label:'틀린 곳 찾기', desc:'카톡 대화에 숨은 틀린 표기를 눌러 찾아요.'},
  {id:'basis', label:'근거 조항 고르기', desc:'이 표기가 왜 맞는지, 조항을 고릅니다.'},
  {id:'blank', label:'조항 빈칸 채우기', desc:'조항 원문의 빈칸에 들어갈 말을 씁니다.'},
];
const KIND_LABEL = {pick:'바른 표기 고르기', basis:'근거 조항 고르기', blank:'조항 빈칸', spot:'틀린 곳 찾기', swipe:'쓱쓱 넘기기 · 맞으면 →  틀리면 ←'};
function h(str){ let x=5381; for(let i=0;i<str.length;i++) x=((x<<5)+x+str.charCodeAt(i))|0; return (x>>>0).toString(36); }
const PICKS = D.picks.map(p=>Object.assign({id:'p'+h(p.s+'|'+p.o)}, p));
const BLANKS = D.blanks.map(b=>Object.assign({id:'b'+h(b.a+'|'+b.b+'|'+b.k)}, b));
const BYID = {}; PICKS.forEach(p=>{BYID[p.id]=p; BYID['r'+p.id]=p; BYID['o'+p.id]=p;}); BLANKS.forEach(b=>BYID[b.id]=b);
// 틀린 곳 찾기: 메시지 묶음 하나가 문제 하나. 오답 노트에서는 첫 조항으로 묶음
const SPOTS = (window.ORTH_SPOT||[]).map(it=>{
  const txt = it.t.map(b=>b[1].map(p=>typeof p==='string'?p:p.x).join('')).join('|');
  return Object.assign({id:'s'+h(txt), a:it.arts[0]}, it);
});
SPOTS.forEach(x=>BYID[x.id]=x);
// 학교 자료 문제: l = 자료 위치(교과서 118쪽 등), nb = 근거 조항 문제로는 내지 않음
const SRC = {};
Object.keys(SS.src).forEach(key=>{
  let s = SS.src[key]; if(s.use) s = Object.assign({}, SS.src[s.use], {title:s.title, arts:s.arts});
  const P = (s.picks||[]).map(p=>Object.assign({id:'p'+h(p.s+'|'+p.o)}, p));
  const B = (s.blanks||[]).map(b=>Object.assign({id:'b'+h(b.a+'|'+b.b+'|'+b.k)}, b));
  P.forEach(p=>{ BYID[p.id]=p; BYID['o'+p.id]=p; if(!p.nb) BYID['r'+p.id]=p; }); B.forEach(b=>BYID[b.id]=b);
  SRC[key] = {title:s.title, arts:new Set(s.arts||[]), P, B};
});
const schSrc = (sc, slot) => { const m=SS.map[sc]; return m && m[slot] && SRC[m[slot]] || null; };
const slotsOf = sc => SLOTS.filter(x=>PARTS(sc).includes(x.label)).map(x=>Object.assign({ready: x.id==='base' || !!schSrc(sc, x.id)}, x));

/* ---------- 저장: 로그인한 학생마다 따로, 로그인 없이 둘러보면 이 폰 공용 */
function lsGet(k){ try{ return localStorage.getItem(k); }catch(e){ return null; } }
function lsSet(k,v){ try{ if(v==null) localStorage.removeItem(k); else localStorage.setItem(k,v); }catch(e){} }
const AKEY='orth.auth';
let auth=null;        // {token, me:{id,name,school}, tt: 이 사이트가 트래커에 넣어 준 토큰}
try{ const a=JSON.parse(lsGet(AKEY)||'null'); if(a && a.token && a.me && a.me.id) auth=a; }catch(e){}
let guest=false;      // 선생님 페이지(로그인 없이 학교 골라 보기)
function ssGet(k){ try{ return sessionStorage.getItem(k); }catch(e){ return null; } }
function ssSet(k,v){ try{ if(v==null) sessionStorage.removeItem(k); else sessionStorage.setItem(k,v); }catch(e){} }
let teachTok = ssGet('orth.admin') || '';   // 트래커 선생님 로그인(6시간)
let srvT = {school:'', board:null, state:''};
const BASE=()=>({school:null, src:null, srcKey:'', rng:['s','f','w','e'], type:null, n:10, st:{}, wrong:{}, day:'', dayIds:[], total:0, pending:[], outbox:null, bs:{sc:'school', per:'week'}, sk:{last:'', n:0}, open:false});
let skey='orth.v1', store=BASE();
function useStore(){
  skey = auth ? 'orth.v1:'+auth.me.id : 'orth.v1';
  store = BASE();
  try{ const s=JSON.parse(lsGet(skey)||'null'); if(s) Object.assign(store, s); }catch(e){}
  if(!Array.isArray(store.pending)) store.pending=[];
  if(!store.bs) store.bs={sc:'school', per:'week'};
  if(!store.sk) store.sk={last:'', n:0};
  if(auth) store.school=auth.me.school;
  else if(!SCHOOLS.includes(store.school)) store.school=null;
}
function save(){ lsSet(skey, JSON.stringify(store)); }
function setAuth(token, me){
  const same = !!auth && auth.me.id===me.id;
  auth = {token, me:{id:me.id, name:me.name, school:me.school}, tt: same ? (auth.tt||'') : ''};
  lsSet(AKEY, JSON.stringify(auth));
  if(same){ store.school=me.school; save(); } else useStore();
}
function today(){ const d=new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function todayCount(){ return store.day===today() ? store.dayIds.length : 0; }
function yesterday(){ const d=new Date(); d.setDate(d.getDate()-1); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
// 연속 일수(이 기기 기준): 하루에 한 문제라도 맞히면 이어짐
function streak(){ const k=store.sk; if(k.last===today()) return k.n; if(k.last===yesterday()) return k.n; return 0; }
function bumpStreak(){ const k=store.sk, t=today(); if(k.last===t) return; k.n = k.last===yesterday() ? k.n+1 : 1; k.last=t; }

/* ---------- 서버 */
let srv = {state:'', board:null};   // state: loading · ok · noserver · neterr · relogin
function api(action, payload){
  const ctl = typeof AbortController!=='undefined' ? new AbortController() : null;
  const tm = ctl ? setTimeout(()=>ctl.abort(), 15000) : null;
  return fetch(API, {method:'POST', body:JSON.stringify(Object.assign({action}, payload||{})), signal: ctl ? ctl.signal : undefined})
    .then(r=>r.json()).then(x=>{ clearTimeout(tm); return x || {ok:false, error:'빈 응답'}; })
    .catch(()=>{ clearTimeout(tm); return {ok:false, net:true, error:'서버에 연결되지 않습니다. 인터넷 연결을 확인하고 다시 시도해 주세요.'}; });
}
const authErr = r => !!r && !r.ok && /로그인 시간이 지났|등록된 학생이 아닙/.test(r.error||'');
const noServer = r => !!r && !r.ok && /알 수 없는 요청/.test(r.error||'');
const newCid = () => 'c'+Date.now().toString(36)+Math.random().toString(36).slice(2,8);
const unsent = () => (store.outbox ? store.outbox.res : []).concat(store.pending);

// 서버 숫자로 맞추고, 아직 안 올라간 것만 다시 얹음
function applyMine(m){
  if(!m) return;
  store.total=+m.total||0; store.day=m.day||''; store.dayIds=(m.dayIds||[]).slice();
  unsent().forEach(([id,ok])=>{ if(ok && store.day===today() && !store.dayIds.includes(id)){ store.dayIds.push(id); store.total++; } });
}
function applyOrth(o){
  if(!o) return;
  const st={}; Object.keys(o.st||{}).forEach(id=>{ const v=o.st[id]||[]; st[id]={c:+v[0]||0, w:+v[1]||0}; });
  const wrong={}; (o.wrong||[]).forEach(id=>{ wrong[id]=1; });
  store.st=st; store.wrong=wrong;
  unsent().forEach(([id,ok])=>{ const s=store.st[id]||(store.st[id]={c:0,w:0}); if(ok){ s.c++; delete store.wrong[id]; } else { s.w++; store.wrong[id]=1; } });
  applyMine(o.mine); srv.board=o.board||null; srv.state='ok'; save();
}
// 푼 결과 올리기(묶음 번호가 같으면 서버가 한 번만 반영)
let flushing=null;
function flush(){
  if(!auth || !API) return Promise.resolve(null);
  if(flushing) return flushing;
  if(!store.outbox){
    if(!store.pending.length) return Promise.resolve(null);
    store.outbox={cid:newCid(), res:store.pending.splice(0,200)}; save();
  }
  const box=store.outbox, who=auth.me.id;
  flushing = api('orthSync', {token:auth.token, cid:box.cid, res:box.res}).then(r=>{
    flushing=null;
    if(!auth || auth.me.id!==who) return r;
    if(r.ok){
      if(store.outbox && store.outbox.cid===box.cid) store.outbox=null;
      applyMine(r.mine); if(r.board) srv.board=r.board; srv.state='ok'; save();
      if(store.pending.length) return flush();
    }
    else if(authErr(r)) srv.state='relogin';
    else if(noServer(r)) srv.state='noserver';
    else if(!srv.board) srv.state='neterr';
    redraw();
    return r;
  });
  return flushing;
}
// 창을 닫거나 다른 앱으로 넘어갈 때 남은 기록을 보내 둠(다음에 같은 묶음 번호로 다시 보내도 한 번만 셈)
function beacon(){
  if(!auth || !API || flushing || !navigator.sendBeacon) return;
  if(!store.outbox){ if(!store.pending.length) return; store.outbox={cid:newCid(), res:store.pending.splice(0,200)}; save(); }
  try{ navigator.sendBeacon(API, JSON.stringify({action:'orthSync', token:auth.token, cid:store.outbox.cid, res:store.outbox.res})); }catch(e){}
}
document.addEventListener('visibilitychange', ()=>{ if(document.visibilityState==='hidden') beacon(); });
window.addEventListener('pagehide', beacon);

function refresh(fromBoot){
  if(!auth || !API) return;
  if(!srv.board) srv.state='loading';
  const who=auth.me.id;
  flush().then(r=>{
    if(!auth || auth.me.id!==who) return;
    if(r && authErr(r)) return lost(fromBoot);
    return api('orthHome', {token:auth.token}).then(x=>{
      if(!auth || auth.me.id!==who) return;
      if(x.ok && x.me){ setAuth(x.otoken||auth.token, x.me); applyOrth(x.orth); }
      else if(authErr(x)) return lost(fromBoot);
      else if(noServer(x)) srv.state='noserver';
      else if(!srv.board) srv.state='neterr';
      redraw();
    });
  });
}
function lost(fromBoot){ srv.state='relogin'; if(fromBoot && view==='home') return relogin(); redraw(); }
function redraw(){ if(view==='home') renderHome(); else if(view==='notes') renderNotes(); }

/* ---------- 유틸 */
const esc0 = s => String(s==null?'':s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
/* 화면 표시용: 줄 끝에서 ‘-’ 뒤로 끊기지 않게 줄 바꿈 없는 하이픈으로 */
const esc = s => esc0(s).replace(/-/g,'‑');
const shuffle = a => { a=a.slice(); for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; };
const norm = s => String(s).replace(/[\s‘’'"“”\-·,.()]/g,'');
function artLabel(n){ const a=ART[n]; return '제'+n+'항'+(a?' · '+a.k:''); }
function partLabel(p){ return p && p.p ? ' '+(/^\d/.test(p.p)?p.p:'['+p.p+']') : ''; }
const hero = t => '<div class="hero"><img src="logo.webp" alt="" width="80" height="80"><div class="bubble">'+t+'</div></div>';

/* ---------- 범위: 기본 개념(장별) + 우리 학교 교과서·프린트·올림포스(그 자료 문제 + 관련 조항 문제 전부) */
function allowedArts(rng){
  const chs = new Set(); RANGES.filter(r=>rng.includes(r.id)).forEach(r=>r.ch.forEach(c=>chs.add(c)));
  return new Set(D.arts.filter(a=>chs.has(a.c)).map(a=>a.n));
}
// 고른 범위(자료가 새로 생기면 다시 전부 고른 상태로 시작)
function srcSel(){
  const ready = slotsOf(store.school).filter(x=>x.ready).map(x=>x.id), key = store.school+':'+ready.join();
  if(store.srcKey!==key || !Array.isArray(store.src)){ store.src=ready.slice(); store.srcKey=key; }
  const sel = store.src.filter(id=>ready.includes(id));
  return sel.length ? sel : ready;
}
function scopeItems(sel, arts){
  // arts: 기본 개념에서 쓸 조항(장 고르기), sel: 고른 범위. 학교 자료 문제를 먼저 넣어 같은 문제면 자료 위치가 붙은 쪽을 씀
  const P = new Map(), B = new Map();
  const addP = p=>{ if(!P.has(p.id)) P.set(p.id, p); }, addB = b=>{ if(!B.has(b.id)) B.set(b.id, b); };
  const want = new Set();
  sel.forEach(slot=>{ if(slot==='base') return; const s=schSrc(store.school, slot); if(!s) return;
    s.P.forEach(addP); s.B.forEach(addB); s.arts.forEach(n=>want.add(n)); });
  if(sel.includes('base')) arts.forEach(n=>want.add(n));
  PICKS.forEach(p=>{ if(want.has(p.a)) addP(p); }); BLANKS.forEach(b=>{ if(want.has(b.a)) addB(b); });
  return {P:[...P.values()], B:[...B.values()], S: SPOTS.filter(x=>x.arts.some(a=>want.has(a)))};
}
function buildPool(type, S){
  const pick = p=>({kind:'pick', it:p, id:p.id}), basis = p=>({kind:'basis', it:p, id:'r'+p.id}), blank = b=>({kind:'blank', it:b, id:b.id});
  if(type==='pick') return S.P.map(pick);
  if(type==='basis') return S.P.filter(p=>!p.nb).map(basis);
  if(type==='blank') return S.B.map(blank);
  if(type==='spot') return S.S.map(x=>({kind:'spot', it:x, id:x.id}));
  if(type==='swipe') return S.P.filter(p=>!p.ez).map(p=>({kind:'swipe', it:p, id:'o'+p.id}));
  return S.P.map(p=>(p.nb || Math.random()<.55)?pick(p):basis(p)).concat(S.B.map(blank));
}
const homePool = (type) => buildPool(type||store.type, scopeItems(srcSel(), allowedArts(store.rng)));
// 틀린 곳 찾기·쓱쓱: 홈 버튼에서 바로 시작(지금 고른 범위로)
function startMode(type){ const pool=homePool(type); if(!pool.length) return; startSession(sample(pool, type==='swipe'?Math.max(store.n,15):store.n), {from:'home', type}); }
// 조항 하나: 공통 문제 + 우리 학교 자료 중 그 조항 문제
function artItems(n){
  const sc=store.school, S=scopeItems(slotsOf(sc).filter(x=>x.ready && x.id!=='base').map(x=>x.id), new Set());
  const P=S.P.filter(p=>p.a===n), B=S.B.filter(b=>b.a===n), ids=new Set(P.map(p=>p.id).concat(B.map(b=>b.id)));
  PICKS.forEach(p=>{ if(p.a===n && !ids.has(p.id)) P.push(p); }); BLANKS.forEach(b=>{ if(b.a===n && !ids.has(b.id)) B.push(b); });
  return {P, B};
}
function weight(id){ const s=store.st[id]; if(store.wrong[id]) return 5; if(!s) return 3; if(s.w>s.c) return 3; return 1; }
function sample(pool, n){
  return pool.map(q=>({q, k:Math.pow(Math.random(), 1/weight(q.id))})).sort((a,b)=>b.k-a.k).slice(0,n).map(x=>x.q);
}
function basisOptions(n){
  const near = new Set();
  D.groups.forEach(g=>{ if(g.includes(n)) g.forEach(x=>{ if(x!==n && ART[x]) near.add(x); }); });
  let cand = shuffle([...near]).slice(0,3);
  if(cand.length<3){ const same = shuffle(D.arts.filter(a=>a.c===ART[n].c && a.n!==n && !cand.includes(a.n)).map(a=>a.n)); cand = cand.concat(same).slice(0,3); }
  return shuffle([n].concat(cand));
}
function prepare(q){
  if(q.kind==='pick') q.opts = shuffle([q.it.o, q.it.x]);
  if(q.kind==='basis') q.opts = basisOptions(q.it.a);
  if(q.kind==='swipe') q.show = Math.random()<.5;   // true면 바른 표기를 보여 줌
  return q;
}

function onLoginSubmit(ev){
  ev.preventDefault();
  const f=ev.target; if(f.dataset.busy) return;
  const val = id => (document.getElementById(id)||{}).value || '';
  const fail = m => { L.err=m; renderLogin(); };
  const busy = () => { f.dataset.busy='1'; const b=f.querySelector('button[type="submit"]'); if(b){ b.disabled=true; b.textContent='확인 중…'; } };
  if(f.id==='f-name'){
    const nm=val('in-name').trim(); L.name=nm;
    if(!nm) return fail('이름을 입력해 주세요.');
    busy();
    api('lookup', {name:nm}).then(r=>{
      if(!r.ok) return fail(r.error);
      L.err=''; L.matches=r.matches||[];
      if(L.matches.length===1){ L.pick=L.matches[0]; renderLogin('pw'); } else renderLogin('pick');
    });
  } else if(f.id==='f-pw'){
    const pw=val('in-pw');
    if(!/^\d{4}$/.test(pw)) return fail('숫자 4자리를 입력해 주세요.');
    busy();
    const id=L.pick.id;
    api('orthLogin', {id, pw})
      .then(r=> noServer(r) ? api('login', {id, pw}).then(x=>Object.assign(x, {noOrth:true})) : r)
      .then(r=>{
        if(!r.ok) return fail(r.error);
        L.err=''; L.tok=r.token;
        if(r.me.mustChange) return renderLogin('change');
        enter(r);
      });
  } else if(f.id==='f-admin'){
    const pw=val('in-apw');
    if(!pw) return fail('비밀번호를 입력해 주세요.');
    busy();
    api('adminLogin', {pw}).then(r=>{
      if(!r.ok) return fail(r.error);
      teachTok=r.token; ssSet('orth.admin', r.token);
      resetL(); guest=true; useStore(); srvT={school:'', board:null, state:''}; renderPick();
    });
  } else if(f.id==='f-change'){
    const a=val('in-new'), b=val('in-new2');
    if(!/^\d{4}$/.test(a)) return fail('비밀번호는 숫자 4자리로 정해 주세요.');
    if(a!==b) return fail('두 번 입력한 비밀번호가 서로 다릅니다.');
    busy();
    api('orthChangePw', {token:L.tok, newPw:a})
      .then(r=> noServer(r) ? api('changePw', {token:L.tok, newPw:a}).then(x=>Object.assign(x, {noOrth:true})) : r)
      .then(r=>{
        if(!r.ok){ if(authErr(r)){ const nm=L.name; resetL(); L.name=nm; return fail('시간이 지나 처음부터 다시 로그인해 주세요.'); } return fail(r.error); }
        r.token=L.tok; enter(r);
      });
  }
}
function enter(r){
  setAuth(r.otoken || r.token, r.me);
  // 트래커가 로그인 안 된 폰이면 트래커도 같이 로그인(트래커 쪽은 6시간 유지)
  if(r.token && !lsGet('clinic.token')){ lsSet('clinic.token', r.token); lsSet('clinic.role', 'student'); auth.tt=r.token; lsSet(AKEY, JSON.stringify(auth)); }

  else { srv.state = r.noOrth ? 'noserver' : 'loading'; go('practice'); if(!r.noOrth) refresh(false); }
}

function bubbleText(){
  if(!auth) return '학교를 골라 범위를 미리 볼 수 있습니다.';
  if(srv.state==='relogin') return '로그인이 만료됐어요. 다시 로그인하면 기록이 이어집니다.';
  const b = srv.board && srv.board.school ? srv.board.school.week : null, me = b && b.me;
  const t = todayCount();
  if(me && me.up) return me.up.gap===1 ? '한 문제만 더 맞히면 '+me.up.r+'위예요.' : me.up.gap+'문제만 더 맞히면 '+me.up.r+'위예요.';
  if(me && me.tied>1) return '공동 1위예요. 한 문제만 더 맞히면 단독 1위!';
  if(me && me.r===1) return '이번 주 1위예요. 자리 지켜 볼까요?';
  const sch = srv.board && srv.board.sch;
  if(sch && sch.length>1){
    const rows = sch.map(x=>({s:x.s, avg:x.n?x.w/x.n:0})).sort((a,b)=>b.avg-a.avg), i = rows.findIndex(r=>r.s===store.school);
    if(i>0) return rows[0].s+'보다 우리 학교가 1인당 '+(Math.round((rows[0].avg-rows[i].avg)*10)/10)+'개 뒤처져요. 한 문제가 평균을 올립니다.';
    if(i===0 && rows[1] && rows[0].avg>0) return '학교 대항 1위예요. '+rows[1].s+'가 '+(Math.round((rows[0].avg-rows[1].avg)*10)/10)+'개 차이로 따라와요.';
  }
  if(t) return '오늘 '+t+'문제 맞혔어요. 조금만 더?';
  return '느낌이 아니라 조항을 근거로 골라 보세요.';
}
function rankHTML(b, all, teach){
  if(!b.top.length) return '<div class="rank-msg">'+(teach?'아직 기록이 없습니다.':'아직 기록이 없습니다. 한 문제만 맞혀도 1위입니다.')+'</div>';
  const row = g => '<div class="r'+(g.r<=3?' top':'')+(g.me?' me':'')+'"><span class="no">'+g.r+'위</span><span class="nm">'+
    g.n.map(x=>'<span>'+esc(x[0])+(all && x[1] ? '<small>'+esc(x[1])+'</small>' : '')+'</span>').join(' <i class="sep">·</i> ')+
    (g.more?' <i class="sep">외 '+g.more+'명</i>':'')+'</span><span class="d">'+g.d+'개</span></div>';
  let rows=b.top.map(row).join('');
  if(b.mine) rows+='<div class="gap">⋯</div>'+row(b.mine);
  if(teach) return '<div class="rank">'+rows+'</div>';
  const me=b.me; let msg;
  if(me){
    if(me.up) msg=me.up.r+'위까지 '+me.up.gap+'개 남았습니다.';
    else if(me.tied>1) msg='공동 1위입니다. 한 문제만 더 맞히면 단독 1위입니다.';
    else if(me.lead) msg='2위보다 '+me.lead+'개 앞서 있습니다.';
    else msg='현재 1위입니다.';
  } else msg = '한 문제만 맞혀도 순위에 올라갑니다.';
  return '<div class="rank">'+rows+'</div><div class="rank-msg go">'+msg+'</div>';
}

/* ---------- 세션 */
function leaveSess(){ if(sess && sess.unkey){ sess.unkey(); sess.unkey=null; } if(sess && sess.timer){ clearTimeout(sess.timer); sess.timer=null; } }
function startSession(qs, meta){
  if(!qs.length) return;
  leaveSess();
  sess = {qs: qs.map(prepare), i:0, res:[], meta:meta||{}};
  renderQ();
}
function startWrong(){
  const qs = Object.keys(store.wrong).map(id=>{
    const it=BYID[id]; if(!it) return null;
    const kind = {r:'basis', b:'blank', s:'spot', o:'swipe'}[id[0]] || 'pick';
    return {kind, it, id};
  }).filter(Boolean);
  startSession(shuffle(qs).slice(0,15), {from:'wrong'});
}
function startArt(n){
  const S = artItems(n), pool = buildPool(S.P.length?'mix':'blank', S);
  startSession(sample(pool, Math.min(10,pool.length)), {from:'art', n});
}
// 누적 정답은 같은 문제를 하루에 한 번만 셈(서버 순위와 같은 기준)
function record(q, ok){
  const s = store.st[q.id] || (store.st[q.id]={c:0,w:0});
  if(ok){ s.c++; delete store.wrong[q.id];
    if(store.day!==today()){ store.day=today(); store.dayIds=[]; }
    if(!store.dayIds.includes(q.id)){ store.dayIds.push(q.id); store.total++; }
    bumpStreak();
  } else { s.w++; store.wrong[q.id]=1; }
  if(auth) store.pending.push([q.id, ok?1:0]);
  save();
}
function sentFilled(p, mode, chosen){
  // mode: 'blank' 빈칸, 'ok' 정답 채움, 'fix' 오답 교정, 'mark' 근거용 밑줄
  let slot;
  if(mode==='blank') slot='<span class="slot">&nbsp;</span>';
  else if(mode==='ok') slot='<span class="slot on">'+esc(p.o)+'</span>';
  else if(mode==='fix') slot='<span class="fix"><s>'+esc(chosen)+'</s><b>'+esc(p.o)+'</b></span>';
  else slot='<span class="mark">'+esc(p.o)+'</span>';
  return esc(p.s).replace('□', slot);
}
function whyLine(p){
  return '<div class="why"><b>'+esc('제'+p.a+'항'+partLabel(p))+'</b> · '+esc(ART[p.a]?ART[p.a].k:'')+(p.w?'<br>'+esc(p.w):'')+'</div>';
}
function renderQ(){
  view='q';
  const q = sess.qs[sess.i], n = sess.qs.length, it=q.it;
  let body='';
  if(q.kind==='pick'){
    body='<p class="qsent" id="qs">'+sentFilled(it,'blank')+'</p>'+
      '<div class="opts two">'+q.opts.map((o,k)=>'<button type="button" class="opt" data-o="'+k+'">'+esc(o)+'</button>').join('')+'</div>';
  } else if(q.kind==='basis'){
    body='<p class="qsent">'+sentFilled(it,'mark')+'</p><p class="note" style="margin:-8px 0 14px">밑줄 친 표기의 근거가 되는 조항을 고르세요.</p>'+
      '<div class="opts">'+q.opts.map((a,k)=>'<button type="button" class="opt" data-o="'+k+'"><b>제'+a+'항</b><small>'+esc(ART[a].k)+'</small></button>').join('')+'</div>';
  } else if(q.kind==='spot'){
    body='<p class="note" style="margin:0 0 12px">틀린 표기를 모두 눌러 고르세요.</p><div class="chat">'+it.t.map((b,bi)=>
      '<div class="msg '+b[0]+'"><div class="bb">'+b[1].map((p,pi)=> typeof p==='string'
        ? p.split(/(\s+)/).map(w=>/^\s+$/.test(w)?w:(w?'<button type="button" class="tk" data-t="'+bi+'-'+pi+'-'+esc0(w)+'">'+esc(w)+'</button>':'')).join('')
        : '<button type="button" class="tk" data-t="'+bi+'-'+pi+'" data-e="'+(p.o?'1':'')+'">'+esc(p.x)+'</button>').join('')+'</div></div>').join('')+'</div>'+
      '<button type="button" class="btn primary wide next" id="chk">확인</button>';
  } else if(q.kind==='swipe'){
    const word = q.show ? it.o : it.x;
    body='<div class="swipe" id="sw"><div class="swc" id="sc"><p class="qsent" style="margin:0">'+esc(it.s).replace('□','<span class="mark">'+esc(word)+'</span>')+'</p>'+
      '<span class="stamp no" id="st-no">틀림</span><span class="stamp ok" id="st-ok">맞음</span></div></div>'+
      '<div class="swhint"><span>← <b>틀림</b></span><span>'+(sess.i===0?'카드를 옆으로 밀어 보세요':'')+'</span><span><b>맞음</b> →</span></div>';
  } else {
    body='<p class="note" style="margin:0 0 12px">제'+it.a+'항 · 빈칸에 들어갈 말을 쓰세요. 앞뒤 낱말까지 같이 써도 됩니다.</p>'+
      '<div class="blankrow">'+esc(it.b)+'<input id="bi" style="width:'+Math.min(12, Math.max(4, it.k.length+1.5))+'em" autocomplete="off" autocapitalize="off" spellcheck="false" aria-label="빈칸">'+esc(it.f)+'</div>'+
      '<button type="button" class="btn next" id="chk">확인</button>';
  }
  app.innerHTML =
    '<div class="qtop"><span>'+(sess.i+1)+' / '+n+'</span><button type="button" class="linkbtn" id="quit">그만하기</button></div>'+
    '<div class="bar"><i style="width:'+(sess.i/n*100)+'%"></i></div>'+
    '<div class="qkind">'+KIND_LABEL[q.kind]+(it.l?' · '+esc(it.l):'')+'</div>'+body+'<div class="fb" id="fb"></div>';
  document.getElementById('quit').onclick=()=>{ leaveSess(); if(sess.res.length) renderResult(); else if(sess.meta.from==='art'){ sess=null; go('rules'); } else go('practice'); };
  if(q.kind==='spot'){
    app.querySelectorAll('.tk').forEach(b=>{ b.setAttribute('aria-pressed','false'); b.onclick=()=>{ const on=b.classList.toggle('sel'); b.setAttribute('aria-pressed', on?'true':'false'); }; });
    document.getElementById('chk').onclick=()=>answerSpot(q);
  } else if(q.kind==='swipe'){
    bindSwipe(q);
  } else if(q.kind==='blank'){
    const inp=document.getElementById('bi'); inp.focus();
    const done=()=>answerBlank(q, inp.value);
    document.getElementById('chk').onclick=done;
    inp.onkeydown=e=>{ if(e.key==='Enter'){ e.preventDefault(); done(); } };
  } else {
    app.querySelectorAll('.opt').forEach(b=>b.onclick=()=>answerOpt(q, +b.dataset.o));
  }
}
function afterAnswer(ok, q, extra){
  record(q, ok); sess.res.push({q, ok, extra});
  const fb=document.getElementById('fb');
  fb.innerHTML = (ok ? '<div class="okmark"><img src="check.webp" alt="">정답</div>' : (extra||'')) +
    '<button type="button" class="btn primary next" id="nx">'+(sess.i+1<sess.qs.length?'다음':'결과 보기')+'</button>';
  const nx=document.getElementById('nx'); nx.focus();
  nx.onclick=()=>{ sess.i++; sess.i<sess.qs.length ? renderQ() : renderResult(); };
}
function answerOpt(q, k){
  const btns=[...app.querySelectorAll('.opt')]; btns.forEach(b=>b.disabled=true);
  if(q.kind==='pick'){
    const chosen=q.opts[k], ok = chosen===q.it.o;
    btns.forEach((b,i)=>{ if(q.opts[i]===q.it.o) b.classList.add('ok'); else if(i===k) b.classList.add('ng'); });
    document.getElementById('qs').innerHTML = sentFilled(q.it, ok?'ok':'fix', chosen);
    afterAnswer(ok, q, ok?'':whyLine(q.it));
    if(!ok) sess.res[sess.res.length-1].chosen=chosen;
  } else {
    const chosen=q.opts[k], ok = chosen===q.it.a;
    btns.forEach((b,i)=>{ if(q.opts[i]===q.it.a) b.classList.add('ok'); else if(i===k) b.classList.add('ng'); });
    afterAnswer(ok, q, ok?'':whyLine(q.it));
  }
}
function answerBlank(q, val){
  if(!String(val).trim()){ document.getElementById('bi').focus(); return; }
  const it=q.it;
  // 앞뒤 낱말을 붙여 써도 맞게 침("소리대로"처럼)
  const pre=(it.b.match(/(\S+)\s*$/)||['',''])[1], post=(it.f.match(/^\s*(\S+)/)||['',''])[1];
  const v=norm(val), ok = [it.k].concat(it.alt||[]).some(a=>[a, a+post, pre+a, pre+a+post].some(c=>norm(c)===v));
  const inp=document.getElementById('bi'); inp.disabled=true;
  document.getElementById('chk').remove();
  if(!ok){
    inp.outerHTML='<span class="fix"><s>'+esc(val)+'</s><b>'+esc(it.k)+'</b></span>';
  } else inp.style.borderBottomColor='var(--accent)';
  afterAnswer(ok, q, ok?'':'<div class="why"><b>정답: '+esc(it.k)+'</b></div>');
  if(!ok) sess.res[sess.res.length-1].chosen=val;
}

// 틀린 곳 찾기: 틀린 것을 다 고르고 맞는 것은 안 골라야 정답
function spotErrors(it){ const out=[]; it.t.forEach(b=>b[1].forEach(p=>{ if(typeof p!=='string' && p.o) out.push(p); })); return out; }
function spotWhy(it){ return spotErrors(it).map(p=>'<div class="why" style="margin-top:8px"><b><s style="color:var(--muted)">'+esc(p.x)+'</s> → '+esc(p.o)+'</b> · 제'+p.a+'항 '+esc(ART[p.a]?ART[p.a].k:'')+(p.w?'<br>'+esc(p.w):'')+'</div>').join(''); }
function answerSpot(q){
  const tks=[...app.querySelectorAll('.tk')]; let miss=0, extra=0;
  tks.forEach(b=>{ const e=b.dataset.e==='1', sel=b.classList.contains('sel');
    if(e && sel) b.classList.add('hit'); else if(e && !sel){ b.classList.add('missed'); miss++; } else if(!e && sel){ b.classList.add('oops'); extra++; }
    b.disabled=true; });
  document.getElementById('chk').remove();
  const ok = !miss && !extra;
  const head = ok ? '' : '<div class="note" style="margin:0 0 4px">'+(miss?'못 찾은 것 '+miss+'개':'')+(miss&&extra?' · ':'')+(extra?'맞는데 고른 것 '+extra+'개':'')+'</div>';
  afterAnswer(ok, q, head+spotWhy(q.it));
  app.querySelectorAll('.tk.hit, .tk.missed').forEach(b=>{ const p=findPart(q.it, b.dataset.t); if(p) b.innerHTML='<s>'+esc(p.x)+'</s><b>'+esc(p.o)+'</b>'; });
}
function findPart(it, t){ const [bi,pi]=t.split('-').map(Number); const p=it.t[bi]&&it.t[bi][1][pi]; return p && typeof p!=='string' ? p : null; }
// 쓱쓱: 오른쪽 = 맞음, 왼쪽 = 틀림. 손가락으로 넘기거나 버튼
function bindSwipe(q){
  const card=document.getElementById('sc'), ok=document.getElementById('st-ok'), no=document.getElementById('st-no');
  if(sess.i===0) card.classList.add('nudge');
  let x0=null, t0=0, dx=0, done=false;
  const set = d => { dx=d; card.style.transform='translateX('+d+'px) rotate('+(d/18)+'deg)'; ok.style.opacity=Math.min(1,Math.max(0,d/50)); no.style.opacity=Math.min(1,Math.max(0,-d/50)); };
  const fire = yes => { if(done) return; done=true; card.style.transition='transform .22s ease-out'; set(yes?460:-460); setTimeout(()=>answerSwipe(q, yes), 160); };
  const start = x => { if(done) return; card.classList.remove('nudge'); x0=x; t0=Date.now(); card.style.transition='none'; };
  const move = x => { if(x0==null||done) return; set(x-x0); };
  // 60px 넘게 밀었거나, 짧게라도 빠르게 튕기면 넘어감(틴더처럼)
  const end = ()=>{ if(x0==null||done) return; const v=dx/Math.max(1,Date.now()-t0); x0=null;
    if(dx>60 || (dx>20 && v>0.5)) fire(true); else if(dx<-60 || (dx<-20 && v<-0.5)) fire(false); else { card.style.transition='transform .2s'; set(0); } };
  // iOS 사파리는 pointer 이벤트가 스크롤에 먹히는 때가 있어 touch 이벤트로 받고 기본 동작을 막는다
  if('ontouchstart' in window){
    card.addEventListener('touchstart', e=>{ start(e.touches[0].clientX); }, {passive:true});
    card.addEventListener('touchmove', e=>{ e.preventDefault(); move(e.touches[0].clientX); }, {passive:false});
    card.addEventListener('touchend', end); card.addEventListener('touchcancel', end);
  } else {
    card.addEventListener('pointerdown', e=>{ start(e.clientX); card.setPointerCapture(e.pointerId); });
    card.addEventListener('pointermove', e=>move(e.clientX));
    card.addEventListener('pointerup', end); card.addEventListener('pointercancel', end);
  }
  const S=sess;
  const key = e=>{ if(sess!==S || view!=='q' || S.qs[S.i]!==q){ document.removeEventListener('keydown', key); return; } if(e.key==='ArrowRight'){ fire(true); document.removeEventListener('keydown', key); } else if(e.key==='ArrowLeft'){ fire(false); document.removeEventListener('keydown', key); } };
  document.addEventListener('keydown', key);
  sess.unkey = ()=>document.removeEventListener('keydown', key);
}
function answerSwipe(q, yes){
  const it=q.it, ok = yes===q.show;
  if(sess.unkey){ sess.unkey(); sess.unkey=null; }
  const sw=document.getElementById('sw'); if(sw) sw.innerHTML='<div class="swc still"><p class="qsent" style="margin:0">'+sentFilled(it, q.show?'ok':'fix', it.x)+'</p>'+
    '<img class="stampbig" src="'+(ok?'st-right.webp':'st-wrong.webp')+'" alt="'+(ok?'정답':'오답')+'"></div>';
  if(ok){ record(q, true); sess.res.push({q, ok:true}); const S=sess; S.timer=setTimeout(()=>{ S.timer=null; if(sess===S && view==='q' && S.qs[S.i]===q){ S.i++; S.i<S.qs.length ? renderQ() : renderResult(); } }, 700); return; }
  afterAnswer(ok, q, whyLine(it));
  if(!ok) sess.res[sess.res.length-1].chosen = q.show ? it.o : it.x;
}

/* ---------- 결과 */
function renderResult(){
  view='result';

  }

  const stamp = c===n && n>=5 ? '<img class="stampimg" src="stamp.webp" alt="참 잘했어요">' : '';
  app.innerHTML=hero(kb)+'<div class="scorebox"><div class="qkind">결과</div><p class="score">'+c+' <span>/ '+n+'</span></p>'+stamp+'</div>'+list+
    '<div class="row">'+(wrong.length?'<button type="button" class="btn primary" id="rw">틀린 문제만 다시</button>':'')+
    '<button type="button" class="btn" id="again">한 번 더</button><button type="button" class="btn" id="home2">처음으로</button></div>';
  const rw=document.getElementById('rw'); if(rw) rw.onclick=()=>startSession(shuffle(wrong.map(r=>({kind:r.q.kind,it:r.q.it,id:r.q.id}))), sess.meta);
  document.getElementById('again').onclick=()=>{
    if(sess.meta.from==='art') return startArt(sess.meta.n);
    if(sess.meta.from==='wrong') return startWrong();
    return startMode(sess.meta.type||store.type||'pick');
  };
  document.getElementById('home2').onclick=()=>{ const art=sess.meta.from==='art'; sess=null; go(art?'rules':'practice'); };
  flush();
}

  });
  app.innerHTML=html;
  app.querySelectorAll('[data-art]').forEach(b=>b.onclick=()=>startArt(+b.dataset.art));
}

/* ---------- 오답 노트 */
function renderNotes(){
  view='notes'; setTabs(true);
  const ids=Object.keys(store.wrong).filter(id=>BYID[id]);
  if(!ids.length){ app.innerHTML='<div class="qkind">오답 노트</div><p class="empty">틀린 문제가 없습니다. 아직 풀지 않았거나 틀린 문제를 모두 다시 맞힌 상태입니다.</p>'; return; }
  const by={}; ids.forEach(id=>{ const a=BYID[id].a; (by[a]=by[a]||[]).push(id); });
  const rows=Object.keys(by).map(Number).sort((x,y)=>by[y].length-by[x].length||x-y);
  const max=Math.max(...rows.map(a=>by[a].length));
  app.innerHTML='<div class="qkind">오답 노트</div><p class="note" style="margin-top:0">다시 맞히면 오답 노트에서 빠집니다. 많이 틀린 조항부터 보여 줍니다.</p>'+
    rows.map(a=>'<div class="nrow"><span class="no">제'+a+'항</span><span><span style="display:block;margin-bottom:4px">'+esc(ART[a]?ART[a].k:'')+'</span><span class="meter"><i style="width:'+(by[a].length/max*100)+'%"></i></span></span><button type="button" class="linkbtn" data-goart="'+a+'">'+by[a].length+'개</button></div>').join('')+
    '<button type="button" class="btn primary wide" id="wr">오답만 풀기 ('+ids.length+')</button>';
  document.getElementById('wr').onclick=startWrong;
  app.querySelectorAll('[data-goart]').forEach(b=>b.onclick=()=>{ go('rules'); const d=document.getElementById('a'+b.dataset.goart); if(d){ d.open=true; d.scrollIntoView({block:'start'}); } });
}

/* ---------- 시작: 로그인돼 있으면 바로 내 학교, 트래커에 로그인돼 있으면 그대로 이어서, 아니면 이름부터 */
function boot(){
  useStore();
  if(!API){ guest=true; return renderPick(); }
  if(auth){ go('practice'); refresh(true); return; }
  if(teachTok){ guest=true; return store.school ? go('practice') : renderPick(); }
  const tt = lsGet('clinic.role')==='student' ? lsGet('clinic.token') : null;
  if(tt){
    renderLogin('wait');
    api('orthHome', {token:tt}).then(r=>{
      if(view!=='login' || L.step!=='wait') return;
      if(r.ok && r.me){
        if(r.me.mustChange){ L.tok=tt; return renderLogin('change'); }
        return enter({token:null, otoken:r.otoken||tt, me:r.me, orth:r.orth});
      }
      renderLogin('name');
    });
    return;
  }
  renderLogin('name');
}
boot();
window.__cnt = t => homePool(t).length;   // 자동 검사용(화면에는 안 씀)
})();
</script>
